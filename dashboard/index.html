<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>持仓 Dashboard · —</title>
<meta http-equiv="Cache-Control" content="no-cache">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0a0a0a; color: #e5e5e5;
    padding: 16px; max-width: 720px; margin: 0 auto;
    line-height: 1.55;
  }
  .header {
    background: linear-gradient(135deg, #1e3a8a 0%, #312e81 100%);
    padding: 20px; border-radius: 12px; margin-bottom: 16px;
    text-align: center;
  }
  .header h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .header .date { font-size: 13px; color: #c7d2fe; }
  .section {
    background: #171717; border-radius: 12px; padding: 16px; margin-bottom: 12px;
  }
  .section h2 {
    font-size: 14px; font-weight: 700; color: #fbbf24;
    margin-bottom: 12px; letter-spacing: 0.5px;
  }
  .hero-pnl {
    text-align: center; padding: 24px 16px; border-radius: 12px;
    background: var(--hero-bg); margin-bottom: 12px;
  }
  .hero-pnl .label { font-size: 12px; color: #ffffffcc; }
  .hero-pnl .value { font-size: 36px; font-weight: 800; color: #fff; margin: 8px 0; }
  .hero-pnl .pct { font-size: 16px; color: #ffffffee; }
  .excess {
    margin-top: 12px; padding: 12px; background: #fef3c7;
    border-left: 3px solid #f59e0b; border-radius: 6px;
    color: #92400e; font-size: 13px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 6px; text-align: left; border-bottom: 1px solid #262626; }
  th { color: #9ca3af; font-weight: 600; font-size: 11px; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .red { color: #ef4444; font-weight: 600; }
  .green { color: #10b981; font-weight: 600; }
  .holding-card {
    background: #1f1f1f; border-radius: 8px; padding: 12px; margin-bottom: 8px;
    border-left: 3px solid #ef4444;
  }
  .holding-card.loss { border-left-color: #10b981; }
  .holding-card .name { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
  .holding-card .row {
    display: flex; justify-content: space-between; font-size: 12px;
    color: #d1d5db; padding: 2px 0;
  }
  .holding-card .row .k { color: #9ca3af; }
  .chart-wrap {
    background: #1f1f1f; border-radius: 8px; padding: 12px; margin: 8px 0;
    min-height: 280px; position: relative;
  }
  .chart-wrap canvas { width: 100% !important; max-height: 320px; }
  .chart-loading {
    color: #6b7280; font-size: 12px; text-align: center; padding: 24px;
  }

  /* 加载占位 */
  .skeleton {
    background: linear-gradient(90deg, #1f1f1f 0%, #2a2a2a 50%, #1f1f1f 100%);
    background-size: 200% 100%;
    animation: skeleton 1.4s ease-in-out infinite;
    border-radius: 4px;
    color: transparent;
  }
  @keyframes skeleton {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* 刷新按钮 */
  .refresh-fab {
    position: fixed; bottom: 24px; right: 24px; z-index: 999;
    width: 56px; height: 56px; border-radius: 50%;
    background: linear-gradient(135deg, #1e3a8a, #312e81);
    color: #fff; border: none; cursor: pointer;
    box-shadow: 0 4px 12px rgba(30, 58, 138, 0.4);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; transition: all 0.2s;
  }
  .refresh-fab:hover { transform: scale(1.05); }
  .refresh-fab:active { transform: scale(0.95); }
  .refresh-fab.loading {
    background: #6b7280; cursor: wait;
    animation: spin 1s linear infinite;
  }
  .refresh-fab.success { background: #047857; }
  .refresh-fab.error { background: #b91c1c; }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .refresh-toast {
    position: fixed; bottom: 92px; right: 24px; z-index: 999;
    background: #1f2937; color: #fff; padding: 10px 14px;
    border-radius: 8px; font-size: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    opacity: 0; transition: opacity 0.3s; pointer-events: none;
    max-width: 240px; line-height: 1.5;
  }
  .refresh-toast.show { opacity: 1; }

  .footer {
    text-align: center; color: #6b7280; font-size: 11px;
    padding: 20px 0 40px;
  }
  .footer a { color: #9ca3af; text-decoration: none; }
</style>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e3a8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="持仓 Dashboard">
<link rel="apple-touch-icon" href="images/icon-192.svg">

<!-- Chart.js (本地 vendor, 不走 CDN 保证 offline) -->
<script src="vendor/chart.umd.min.js"></script>
</head>
<body>

<div class="header">
  <h1 data-i18n="title">📊 持仓 Dashboard</h1>
  <div class="date" id="header-date">加载中…</div>
</div>

<!-- 三段式盈亏 (Hero) -->
<div class="hero-pnl" id="hero-pnl" style="--hero-bg: linear-gradient(135deg, #b91c1c 0%, #7f1d1d 100%);">
  <div style="font-size:12px;color:#9ca3af;margin-bottom:8px;text-align:left">📊 三段式盈亏 (今日)</div>

  <div class="hero-row">
    <div class="hero-label">
      <div style="font-size:11px;color:#ffffffaa">① 持仓盈亏</div>
      <div style="font-size:11px;color:#9ca3af">(持仓浮盈/亏)</div>
    </div>
    <div class="hero-value">
      <div class="hero-money" id="floating-abs">—</div>
      <div class="hero-pct" id="floating-pct">—</div>
    </div>
  </div>

  <div class="hero-row">
    <div class="hero-label">
      <div style="font-size:11px;color:#ffffffaa">② 已实现盈亏</div>
      <div style="font-size:11px;color:#9ca3af">(已落袋)</div>
    </div>
    <div class="hero-value">
      <div class="hero-money" id="realized-abs">—</div>
      <div class="hero-pct" id="realized-pct">—</div>
    </div>
  </div>

  <div class="hero-row">
    <div class="hero-label">
      <div style="font-size:11px;color:#ffffffaa">③ 总投资盈亏 <span style="color:#9ca3af">(①+②)</span></div>
      <div style="font-size:11px;color:#9ca3af">总% vs 初始总投入</div>
    </div>
    <div class="hero-value">
      <div class="hero-money" id="total-abs">—</div>
      <div class="hero-pct" id="total-pct">—</div>
    </div>
  </div>
</div>

<div style="font-size:11px;color:#9ca3af;text-align:center;margin-bottom:12px" id="initial-principal-line">
    初始总投入 <b id="initial-principal">—</b> 元
</div>

<div class="excess" id="excess-box" style="display:none">
    <b id="excess-csi300">—</b> 跑赢沪深 300<br>
    <b id="excess-sh">—</b> 跑赢上证指数
</div>

<!-- 当前持仓 -->
<div class="section">
  <h2>💼 当前持仓 (<span id="holdings-count">0</span> 只)</h2>
  <div id="holdings-list"></div>
</div>

<!-- 已清仓 -->
<div class="section" id="closed-section" style="display:none">
  <h2>🚪 已清仓 (<span id="closed-count">0</span> 只)</h2>
  <div style="font-size:11px;color:#9ca3af;margin-bottom:8px" id="closed-summary"></div>
  <div id="closed-list"></div>
</div>

<!-- 交易汇总 -->
<div class="section">
  <h2>💱 交易汇总</h2>
  <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px" id="trade-summary-grid"></div>
</div>

<!-- 累计盈亏趋势 (Chart.js) -->
<div class="section">
  <h2>📈 累计盈亏趋势</h2>
  <div class="chart-wrap"><canvas id="chart-pnl-trend"></canvas></div>
</div>

<!-- 累计收益率 vs 大盘 (Chart.js) -->
<div class="section">
  <h2>🏆 累计收益率 vs 大盘</h2>
  <div class="chart-wrap"><canvas id="chart-benchmark"></canvas></div>
  <div style="font-size:11px;color:#9ca3af;margin-top:8px;text-align:center">
    以首日为基线 0% · 三条线对比
  </div>
</div>

<!-- 交易记录 (近 10 笔) -->
<div class="section">
  <h2>📋 交易记录 (近 <span id="tx-count">0</span> 笔)</h2>
  <table>
    <thead><tr><th>日期</th><th>方向</th><th>标的</th><th class="num">数量</th><th class="num">价格</th></tr></thead>
    <tbody id="tx-tbody"></tbody>
  </table>
</div>

<style>
.hero-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 0;
}
.hero-row + .hero-row { border-top: 1px solid rgba(255,255,255,0.1); }
.hero-value { text-align: right; }
.hero-money { font-size: 18px; font-weight: 700; color: #fff; }
.hero-pct { font-size: 12px; color: #ffffffee; }
.hero-row:nth-child(4) .hero-money { font-size: 22px; font-weight: 800; }
.hero-row:nth-child(4) .hero-pct { font-size: 13px; }
</style>

<div class="footer">
  数据源: Supabase (Q4 决策: 统一到云端) · <a href="data/dashboard.json">JSON</a>
</div>

<!-- 刷新按钮 -->
<button class="refresh-fab" id="refresh-fab" onclick="DashboardApp.refresh()" aria-label="刷新">↻</button>
<div class="refresh-toast" id="refresh-toast"></div>

<!-- 数据 + 渲染 -->
<script src="dashboard.js"></script>
</body>
</html>
